<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="언른낫자">
    <title>혈액 수치 기록</title>
    
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.1.2/dist/chartjs-plugin-annotation.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 8px); }
        .tab-content { display: none; animation: fadeIn 0.25s ease-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { display: none; }
        input:focus, select:focus { outline: none; box-shadow: none; }
    </style>
</head>
<body class="bg-[#f2f2f7] text-gray-900 h-[100dvh] flex flex-col overflow-hidden tracking-tight">

    <header class="bg-white/80 backdrop-blur-md border-b border-gray-200/60 p-4 text-center flex-none z-10 sticky top-0">
        <h1 class="text-[17px] font-bold text-gray-800" id="headerTitle">검사 결과 기록</h1>
    </header>

    <main class="flex-1 overflow-y-auto p-4">
        
        <!-- ==================== 탭 1: 기록 및 OCR ==================== -->
        <div id="tab1" class="tab-content active space-y-5">
            <section class="bg-white p-5 rounded-2xl shadow-[0_2px_10px_rgba(0,0,0,0.03)]">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="font-bold text-sm text-gray-800">📷 사진으로 자동 입력 (여러 장 가능)</h2>
                </div>
                <label class="flex flex-col items-center justify-center w-full h-14 border-2 border-dashed border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50 transition bg-gray-50/50">
                    <div class="flex items-center space-x-2">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        <span class="text-sm font-medium text-gray-600">결과지 사진 업로드</span>
                    </div>
                    <input type="file" id="imageInput" accept="image/*" multiple class="hidden">
                </label>
                <p id="ocrStatus" class="text-[11px] text-gray-500 mt-2 text-center">결과지 사진을 올리면 수치를 자동으로 찾아냅니다.</p>
            </section>

            <section class="bg-white p-5 rounded-2xl shadow-[0_2px_10px_rgba(0,0,0,0.03)]">
                <div class="mb-5 space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">검사 날짜</label>
                        <div class="flex gap-2">
                            <input type="date" id="recordDate" class="flex-1 appearance-none rounded-xl border border-gray-200 py-3 px-3 text-sm bg-gray-50/50 focus:border-gray-400 transition text-left text-gray-800 m-0">
                            <button onclick="loadRecordForDate()" class="bg-gray-100 text-gray-700 px-3.5 rounded-xl text-xs font-bold hover:bg-gray-200 transition active:scale-[0.98]">불러오기</button>
                            <button onclick="deleteRecordForDate()" class="bg-red-50 text-red-600 px-3.5 rounded-xl text-xs font-bold hover:bg-red-100 transition active:scale-[0.98]">삭제</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">상태 메모 (선택)</label>
                        <input type="text" id="recordMemo" placeholder="예: 1차 항암 후 3일차" class="block w-full appearance-none rounded-xl border border-gray-200 py-3 px-3 text-sm bg-gray-50/50 focus:border-gray-400 transition placeholder-gray-300 m-0">
                    </div>
                </div>
                
                <div class="border-t border-gray-100 pt-5 mb-5">
                    <h3 class="text-xs font-semibold text-gray-500 mb-3">수치 직접 입력</h3>
                    <div id="inputFields" class="grid grid-cols-2 gap-x-4 gap-y-3"></div>
                </div>

                <button onclick="saveData()" class="w-full bg-gray-900 text-white font-bold py-3.5 rounded-xl hover:bg-gray-800 transition shadow-sm text-sm active:scale-[0.98]">
                    기록 저장하기 (수정 반영)
                </button>
            </section>
        </div>

        <!-- ==================== 탭 2: 그래프 ==================== -->
        <div id="tab2" class="tab-content space-y-4">
            <section class="bg-white p-5 rounded-2xl shadow-[0_2px_10px_rgba(0,0,0,0.03)]">
                <div class="relative mb-4">
                    <select id="chartSelector" onchange="updateChart()" class="block w-full appearance-none rounded-xl border border-gray-200 py-3 px-3 text-sm font-bold text-gray-800 bg-gray-50/50 pr-8 m-0"></select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
                        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                    </div>
                </div>

                <!-- 기간 필터 버튼들 -->
                <div class="grid grid-cols-5 gap-1 bg-gray-100 p-1 rounded-xl mb-4 text-center">
                    <button onclick="setPeriod('7d')" id="period_7d" class="py-1.5 text-[11px] font-bold rounded-lg transition bg-white shadow-sm text-gray-800">1주일</button>
                    <button onclick="setPeriod('1m')" id="period_1m" class="py-1.5 text-[11px] font-bold rounded-lg transition text-gray-500">1개월</button>
                    <button onclick="setPeriod('6m')" id="period_6m" class="py-1.5 text-[11px] font-bold rounded-lg transition text-gray-500">6개월</button>
                    <button onclick="setPeriod('1y')" id="period_1y" class="py-1.5 text-[11px] font-bold rounded-lg transition text-gray-500">1년</button>
                    <button onclick="setPeriod('custom')" id="period_custom" class="py-1.5 text-[11px] font-bold rounded-lg transition text-gray-500">직접</button>
                </div>

                <!-- 직접지정 달력 영역 (평소엔 숨김) -->
                <div id="customDateArea" class="hidden grid grid-cols-2 gap-2 mb-4 bg-gray-50 p-3 rounded-xl border border-gray-100">
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-1">시작일</label>
                        <input type="date" id="startDate" onchange="updateChart()" class="w-full p-1.5 text-xs rounded-lg border border-gray-200 bg-white">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-1">종료일</label>
                        <input type="date" id="endDate" onchange="updateChart()" class="w-full p-1.5 text-xs rounded-lg border border-gray-200 bg-white">
                    </div>
                </div>

                <div id="trendSummary" class="bg-[#f8f8fb] p-4 rounded-xl mb-6 flex justify-between items-center border border-gray-100/50">
                    <div class="text-xs text-gray-500">기록이 없습니다.</div>
                </div>

                <div class="relative w-full min-h-[250px]">
                    <canvas id="myChart" width="400" height="300"></canvas>
                    <div id="chartEmptyState" class="hidden absolute inset-0 flex items-center justify-center bg-white/90 backdrop-blur-sm rounded-xl z-10 border border-gray-100">
                        <p class="text-sm font-bold text-gray-400">조건에 해당하는 기록이 없습니다.</p>
                    </div>
                </div>
                
                <div class="flex justify-center items-center gap-3 mt-5 pt-4 border-t border-gray-100">
                    <div class="flex items-center gap-1 text-[10px] text-gray-500">
                        <span class="w-2.5 h-2.5 rounded-sm bg-emerald-100 border border-emerald-200"></span> 정상 범주
                    </div>
                    <div class="flex items-center gap-1 text-[10px] text-gray-500">
                        <span class="text-yellow-400 text-xs">●</span> 메모 기록
                    </div>
                </div>
            </section>
        </div>

        <!-- ==================== 탭 3: 설정 ==================== -->
        <div id="tab3" class="tab-content space-y-4">
            
            <section class="bg-white p-5 rounded-2xl shadow-[0_2px_10px_rgba(0,0,0,0.03)] flex flex-col gap-3">
                <div class="flex gap-3">
                    <button onclick="exportData()" class="flex-1 bg-gray-50 text-gray-700 border border-gray-200 font-semibold py-3 rounded-xl text-xs hover:bg-gray-100 transition flex justify-center items-center gap-1.5">
                        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        데이터 백업
                    </button>
                    <label class="flex-1 bg-gray-50 text-gray-700 border border-gray-200 font-semibold py-3 rounded-xl text-xs hover:bg-gray-100 transition flex justify-center items-center gap-1.5 cursor-pointer">
                        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        데이터 복원
                        <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
                    </label>
                </div>
                <button onclick="deleteAllData()" class="w-full bg-red-50 text-red-600 border border-red-200 font-semibold py-3 rounded-xl text-xs hover:bg-red-100 transition flex justify-center items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    모든 데이터 전체 삭제
                </button>
            </section>

            <section class="bg-white p-5 rounded-2xl shadow-[0_2px_10px_rgba(0,0,0,0.03)]">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-gray-800 text-sm">항목 및 정상 범주 설정</h2>
                    <button onclick="addCustomItemField()" class="bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-blue-100 transition flex items-center gap-1">
                        + 항목 추가
                    </button>
                </div>
                
                <div class="flex text-[10px] font-bold text-gray-400 mb-3 px-1">
                    <div class="flex-1">항목명</div>
                    <div class="w-11 text-center">단위</div>
                    <div class="w-12 text-center ml-1">최소</div>
                    <div class="w-12 text-center ml-1">최대</div>
                </div>

                <div id="settingsFields" class="space-y-3 mb-6 pb-2"></div>

                <button onclick="saveSettings()" class="w-full bg-gray-900 text-white font-bold py-3.5 rounded-xl hover:bg-gray-800 transition shadow-sm text-sm active:scale-[0.98]">
                    설정 저장하기
                </button>
            </section>
        </div>

    </main>

    <nav class="bg-white/95 backdrop-blur-lg border-t border-gray-200/60 flex-none pb-safe w-full z-20 shadow-[0_-2px_10px_rgba(0,0,0,0.02)]">
        <div class="flex justify-around items-center h-[60px] px-2 pt-1">
            <button onclick="switchTab(1)" id="btnTab1" class="flex flex-col items-center justify-center w-full h-full text-gray-900 transition">
                <svg class="w-[22px] h-[22px] mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                <span class="text-[10px] font-semibold">기록</span>
            </button>
            <button onclick="switchTab(2)" id="btnTab2" class="flex flex-col items-center justify-center w-full h-full text-gray-400 transition">
                <svg class="w-[22px] h-[22px] mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>
                <span class="text-[10px] font-medium">그래프</span>
            </button>
            <button onclick="switchTab(3)" id="btnTab3" class="flex flex-col items-center justify-center w-full h-full text-gray-400 transition">
                <svg class="w-[22px] h-[22px] mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span class="text-[10px] font-medium">설정</span>
            </button>
        </div>
    </nav>

    <script>
        Chart.defaults.font.family = "'Pretendard', sans-serif";
        Chart.defaults.color = "#6b7280";

        const FIXED_ITEMS = ["AST", "ALT", "LDH", "Albumin", "T-Bil", "NEUT#", "WBC", "Alp", "Ca15-3"];
        let customItems = JSON.parse(localStorage.getItem('customItems')) || [];
        
        const defaultRanges = {
            0: {min: 13, max: 33, unit: "U/L"},
            1: {min: 6, max: 27, unit: "U/L"},
            2: {min: 106, max: 211, unit: "U/L"},
            3: {min: 3.8, max: 5.3, unit: "g/dL"},
            4: {min: 0.20, max: 1.20, unit: "mg/dL"},
            5: {min: 2.0, max: 8.0, unit: "x10³/μL"},
            6: {min: 3.6, max: 9.5, unit: "x10³/μL"}
        };
        let referenceRanges = JSON.parse(localStorage.getItem('referenceRanges')) || defaultRanges;
        let bloodData = JSON.parse(localStorage.getItem('bloodData')) || [];
        let currentChart = null;
        let currentPeriod = '7d';

        function getAllItems() {
            return [...FIXED_ITEMS, ...customItems];
        }

        function renderUI() {
            const dateInput = document.getElementById('recordDate');
            if(!dateInput.value) dateInput.valueAsDate = new Date();
            
            const inputContainer = document.getElementById('inputFields');
            const chartSelector = document.getElementById('chartSelector');
            const settingsContainer = document.getElementById('settingsFields');
            
            inputContainer.innerHTML = '';
            chartSelector.innerHTML = '';
            settingsContainer.innerHTML = '';
            
            const allItems = getAllItems();
            
            allItems.forEach((itemName, i) => {
                const unitText = referenceRanges[i]?.unit ? ` <span class="font-normal text-gray-400">(${referenceRanges[i].unit})</span>` : '';
                
                inputContainer.innerHTML += `
                    <div>
                        <label class="block text-[11px] font-bold text-gray-800 truncate mb-1.5 pl-1">${itemName}${unitText}</label>
                        <input type="number" step="0.01" id="item_${i}" class="block w-full py-2.5 px-3 rounded-xl border border-gray-200 text-sm bg-gray-50/50 focus:border-gray-400 transition placeholder-gray-300 m-0 font-bold text-gray-800" placeholder="0.00">
                    </div>
                `;
                
                chartSelector.innerHTML += `<option value="${i}">${itemName}</option>`;
            });

            allItems.forEach((itemName, i) => {
                const isFixed = i < FIXED_ITEMS.length;
                const minVal = referenceRanges[i]?.min !== undefined ? referenceRanges[i].min : '';
                const maxVal = referenceRanges[i]?.max !== undefined ? referenceRanges[i].max : '';
                const unitVal = referenceRanges[i]?.unit || '';
                
                let nameInputHTML = isFixed 
                    ? `<span class="flex-1 text-[13px] font-bold text-gray-700 truncate pl-1">${itemName}</span>`
                    : `<input type="text" id="customName_${i}" value="${itemName}" class="flex-1 w-20 py-2 px-2 rounded-lg border border-gray-200 text-xs bg-gray-50/50 focus:border-gray-400 transition text-gray-700 m-0 font-bold">`;

                let deleteBtnHTML = isFixed ? '' : `<button onclick="removeCustomItem(${i})" class="text-gray-400 hover:text-red-500 p-1 font-bold text-xs">✕</button>`;

                settingsContainer.innerHTML += `
                    <div class="flex items-center space-x-1.5 mb-2">
                        ${nameInputHTML}
                        <input type="text" id="unit_${i}" value="${unitVal}" placeholder="단위" class="w-11 py-2 px-1 rounded-lg border border-gray-200 text-xs text-center bg-gray-50/50 focus:border-gray-400 text-gray-600 m-0">
                        <input type="number" step="0.01" id="min_${i}" value="${minVal}" placeholder="최소" class="w-12 py-2 px-1 rounded-lg border border-gray-200 text-xs text-center bg-gray-50/50 focus:border-gray-400 text-gray-600 m-0">
                        <input type="number" step="0.01" id="max_${i}" value="${maxVal}" placeholder="최대" class="w-12 py-2 px-1 rounded-lg border border-gray-200 text-xs text-center bg-gray-50/50 focus:border-gray-400 text-gray-600 m-0">
                        ${deleteBtnHTML}
                    </div>
                `;
            });
        }

        // 🌟 기록 불러오기 기능
        function loadRecordForDate() {
            const dateStr = document.getElementById('recordDate').value;
            if(!dateStr) return alert("날짜를 선택해주세요.");
            
            const found = bloodData.find(d => d.date === dateStr);
            const allItems = getAllItems();

            if(!found) {
                alert("해당 날짜에 저장된 기록이 없습니다. 새로 입력 후 저장하세요.");
                document.getElementById('recordMemo').value = '';
                for(let i=0; i<allItems.length; i++) {
                    const el = document.getElementById(`item_${i}`);
                    if(el) el.value = '';
                }
                return;
            }

            document.getElementById('recordMemo').value = found.memo || '';
            for(let i=0; i<allItems.length; i++) {
                const el = document.getElementById(`item_${i}`);
                if(el) {
                    el.value = found.values[i] !== undefined ? found.values[i] : '';
                }
            }
            alert(`${dateStr} 기록을 불러왔습니다. 수정 후 저장하면 반영됩니다.`);
        }

        // 🌟 특정 날짜 기록 삭제 기능
        function deleteRecordForDate() {
            const dateStr = document.getElementById('recordDate').value;
            if(!dateStr) return alert("날짜를 선택해주세요.");
            
            const exists = bloodData.some(d => d.date === dateStr);
            if(!exists) return alert("해당 날짜에 삭제할 기록이 없습니다.");

            if(confirm(`${dateStr} 기록을 정말 삭제하시겠습니까?`)) {
                bloodData = bloodData.filter(d => d.date !== dateStr);
                localStorage.setItem('bloodData', JSON.stringify(bloodData));
                alert("삭제되었습니다.");
                
                document.getElementById('recordMemo').value = '';
                const allItems = getAllItems();
                for(let i=0; i<allItems.length; i++) {
                    const el = document.getElementById(`item_${i}`);
                    if(el) el.value = '';
                }
                updateChart();
            }
        }

        function addCustomItemField() {
            customItems.push(`추가항목 ${customItems.length + 1}`);
            renderUI();
        }

        function removeCustomItem(index) {
            const customIdx = index - FIXED_ITEMS.length;
            customItems.splice(customIdx, 1);
            
            bloodData = bloodData.map(record => {
                const newValues = {};
                for (let key in record.values) {
                    let k = parseInt(key);
                    if (k < index) newValues[k] = record.values[k];
                    else if (k > index) newValues[k - 1] = record.values[k];
                }
                return { ...record, values: newValues };
            });
            localStorage.setItem('bloodData', JSON.stringify(bloodData));
            renderUI();
        }

        function saveSettings() {
            const allItems = getAllItems();
            let newCustomItems = [];
            
            allItems.forEach((itemName, i) => {
                if(i >= FIXED_ITEMS.length) {
                    const inputEl = document.getElementById(`customName_${i}`);
                    if(inputEl) newCustomItems.push(inputEl.value.trim() || `추가항목 ${i}`);
                }
            });
            customItems = newCustomItems;
            localStorage.setItem('customItems', JSON.stringify(customItems));

            const finalAllItems = getAllItems();
            for(let i=0; i<finalAllItems.length; i++) {
                const minVal = parseFloat(document.getElementById(`min_${i}`).value);
                const maxVal = parseFloat(document.getElementById(`max_${i}`).value);
                const unitVal = document.getElementById(`unit_${i}`).value.trim();
                
                if(!isNaN(minVal) || !isNaN(maxVal) || unitVal !== "") {
                    referenceRanges[i] = {
                        min: isNaN(minVal) ? null : minVal,
                        max: isNaN(maxVal) ? null : maxVal,
                        unit: unitVal
                    };
                } else {
                    delete referenceRanges[i];
                }
            }
            localStorage.setItem('referenceRanges', JSON.stringify(referenceRanges));
            renderUI();
            updateChart();
            alert("설정이 저장되었습니다.");
        }

        function switchTab(tabIndex) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab${tabIndex}`).classList.add('active');
            
            const titles = {1: "검사 결과 기록", 2: "수치 변화 그래프", 3: "앱 설정"};
            document.getElementById('headerTitle').innerText = titles[tabIndex];

            [1,2,3].forEach(id => {
                const btn = document.getElementById(`btnTab${id}`);
                const span = btn.querySelector('span');
                if(id === tabIndex) {
                    btn.classList.remove('text-gray-400');
                    btn.classList.add('text-gray-900');
                    span.classList.remove('font-medium');
                    span.classList.add('font-semibold');
                } else {
                    btn.classList.remove('text-gray-900');
                    btn.classList.add('text-gray-400');
                    span.classList.remove('font-semibold');
                    span.classList.add('font-medium');
                }
            });

            if(tabIndex === 2) updateChart();
            document.querySelector('main').scrollTo(0,0);
        }

        function saveData() {
            const dateStr = document.getElementById('recordDate').value;
            const memoStr = document.getElementById('recordMemo').value.trim();
            if(!dateStr) return alert("날짜를 선택해주세요.");

            let record = { date: dateStr, memo: memoStr, values: {} };
            let hasData = false;
            
            const allItems = getAllItems();
            for(let i=0; i<allItems.length; i++) {
                const val = document.getElementById(`item_${i}`).value;
                if(val !== "") {
                    record.values[i] = parseFloat(val);
                    hasData = true;
                }
            }
            if(!hasData) return alert("저장할 수치가 하나도 없습니다.");

            bloodData = bloodData.filter(d => d.date !== dateStr);
            bloodData.push(record);
            bloodData.sort((a, b) => new Date(a.date) - new Date(b.date));

            localStorage.setItem('bloodData', JSON.stringify(bloodData));
            
            const btn = document.querySelector('button[onclick="saveData()"]');
            const originalText = btn.innerText;
            btn.innerText = "✓ 저장 완료";
            btn.classList.replace('bg-gray-900', 'bg-emerald-500');
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.replace('bg-emerald-500', 'bg-gray-900');
                for(let i=0; i<allItems.length; i++) document.getElementById(`item_${i}`).value = '';
                document.getElementById('recordMemo').value = '';
                switchTab(2);
            }, 800);
        }

        function deleteAllData() {
            if(confirm("⚠️ 경고: 저장된 모든 수치 기록과 설정이 완전히 삭제됩니다.\n정말 삭제하시겠습니까?")) {
                if(confirm("‼️ 마지막 확인: 삭제된 데이터는 복구할 수 없습니다.\n진짜로 전부 지우시겠습니까?")) {
                    localStorage.removeItem('bloodData');
                    localStorage.removeItem('customItems');
                    localStorage.removeItem('referenceRanges');
                    alert("모든 데이터가 안전하게 초기화되었습니다.");
                    location.reload(); 
                }
            }
        }

        function setPeriod(period) {
            currentPeriod = period;
            ['7d', '1m', '6m', '1y', 'custom'].forEach(p => {
                const btn = document.getElementById(`period_${p}`);
                if(p === period) {
                    btn.className = "py-1.5 text-[11px] font-bold rounded-lg transition bg-white shadow-sm text-gray-800";
                } else {
                    btn.className = "py-1.5 text-[11px] font-bold rounded-lg transition text-gray-500";
                }
            });

            const customArea = document.getElementById('customDateArea');
            if(period === 'custom') {
                customArea.classList.remove('hidden');
            } else {
                customArea.classList.add('hidden');
            }
            updateChart();
        }

        function updateTrendSummary(selectedItemIndex, itemName, unit, filteredHistory) {
            const summaryEl = document.getElementById('trendSummary');
            
            if(filteredHistory.length === 0) {
                summaryEl.innerHTML = `<div class="text-xs text-gray-500">선택한 기간 내 기록이 없습니다.</div>`;
                return;
            }

            const current = filteredHistory[filteredHistory.length - 1];
            const currentVal = current.values[selectedItemIndex];
            const date = current.date.substring(5);
            
            let trendHtml = `<span class="text-gray-300 text-xs ml-2 font-light">-</span>`;
            
            if(filteredHistory.length >= 2) {
                const previousVal = filteredHistory[filteredHistory.length - 2].values[selectedItemIndex];
                const diff = (currentVal - previousVal).toFixed(2);
                
                if(diff > 0) {
                    trendHtml = `<div class="bg-red-50 text-red-600 font-bold text-[10px] px-2 py-0.5 rounded ml-2 flex items-center">▲ ${diff}</div>`;
                } else if (diff < 0) {
                    trendHtml = `<div class="bg-blue-50 text-blue-600 font-bold text-[10px] px-2 py-0.5 rounded ml-2 flex items-center">▼ ${Math.abs(diff)}</div>`;
                } else {
                    trendHtml = `<div class="bg-gray-100 text-gray-500 font-bold text-[10px] px-2 py-0.5 rounded ml-2 flex items-center">- 유지</div>`;
                }
            }

            summaryEl.innerHTML = `
                <div class="flex flex-col">
                    <span class="text-[10px] text-gray-400 font-medium mb-0.5">최근 업데이트 (${date.replace('-','/')})</span>
                    <div class="flex items-end">
                        <span class="text-2xl font-bold text-gray-800 leading-none">${currentVal}</span>
                        <span class="text-xs text-gray-400 ml-1 mb-0.5">${unit}</span>
                    </div>
                </div>
                <div>${trendHtml}</div>
            `;
        }

        function updateChart() {
            const selector = document.getElementById('chartSelector');
            if(!selector.value) return;

            const selectedItemIndex = parseInt(selector.value);
            const allItems = getAllItems();
            const itemName = allItems[selectedItemIndex];
            const range = referenceRanges[selectedItemIndex];
            const unit = range?.unit || '';

            let filteredHistory = bloodData.filter(d => d.values[selectedItemIndex] !== undefined);

            if (filteredHistory.length > 0) {
                if (currentPeriod !== 'custom') {
                    const latestRecordDateStr = filteredHistory[filteredHistory.length - 1].date;
                    const baseDate = new Date(latestRecordDateStr);
                    
                    let startDate = new Date(baseDate);
                    
                    if (currentPeriod === '7d') {
                        startDate.setDate(baseDate.getDate() - 7);
                    } else if (currentPeriod === '1m') {
                        startDate.setMonth(baseDate.getMonth() - 1);
                    } else if (currentPeriod === '6m') {
                        startDate.setMonth(baseDate.getMonth() - 6);
                    } else if (currentPeriod === '1y') {
                        startDate.setFullYear(baseDate.getFullYear() - 1);
                    }

                    const startDateStr = startDate.toISOString().split('T')[0];
                    filteredHistory = filteredHistory.filter(d => d.date >= startDateStr);
                } else {
                    const startInput = document.getElementById('startDate').value;
                    const endInput = document.getElementById('endDate').value;
                    if(startInput) filteredHistory = filteredHistory.filter(d => d.date >= startInput);
                    if(endInput) filteredHistory = filteredHistory.filter(d => d.date <= endInput);
                }
            }

            updateTrendSummary(selectedItemIndex, itemName, unit, filteredHistory);

            const chartLabels = [];
            const chartData = [];
            const pointColors = [];
            const pointBorderColors = [];
            const pointStyles = [];
            const pointRadii = [];
            const pointMemos = [];

            filteredHistory.forEach(record => {
                chartLabels.push(record.date.substring(5).replace('-','/')); 
                const val = record.values[selectedItemIndex];
                chartData.push(val);
                pointMemos.push(record.memo || '');
                
                if(record.memo) {
                    pointStyles.push('circle'); 
                    pointRadii.push(10);        
                    pointColors.push('rgb(250, 204, 21)'); 
                    pointBorderColors.push('#fff'); 
                } else {
                    pointStyles.push('circle');
                    pointRadii.push(5);
                    pointColors.push('rgb(59, 130, 246)'); 
                    pointBorderColors.push('#fff');
                }
            });

            const emptyStateEl = document.getElementById('chartEmptyState');
            if (chartData.length === 0) {
                emptyStateEl.classList.remove('hidden');
            } else {
                emptyStateEl.classList.add('hidden');
            }

            if(currentChart) currentChart.destroy();

            const annotationConfig = {};
            if (range && (range.min !== null || range.max !== null)) {
                annotationConfig.box1 = {
                    type: 'box',
                    yMin: range.min !== null ? range.min : undefined,
                    yMax: range.max !== null ? range.max : undefined,
                    backgroundColor: 'rgba(16, 185, 129, 0.08)', 
                    borderColor: 'rgba(16, 185, 129, 0.2)',     
                    borderWidth: 1,
                    drawTime: 'beforeDatasetsDraw'
                };
            }

            const ctx = document.getElementById('myChart').getContext('2d');
            currentChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: itemName,
                        data: chartData,
                        borderColor: 'rgb(229, 231, 235)',
                        borderWidth: 2,
                        pointBackgroundColor: pointColors,
                        pointBorderColor: pointBorderColors,
                        pointBorderWidth: 2,
                        pointStyle: pointStyles,
                        pointRadius: pointRadii,
                        pointHoverRadius: 14,
                        pointHitRadius: 30,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    layout: { padding: { top: 15, bottom: 15, left: 10, right: 10 } },
                    interaction: { mode: 'nearest', intersect: true }, 
                    plugins: {
                        legend: { display: false },
                        annotation: { annotations: annotationConfig },
                        tooltip: { 
                            backgroundColor: 'rgba(255,255,255,0.95)',
                            titleColor: '#6b7280',
                            bodyColor: '#111827',
                            borderColor: 'rgba(0,0,0,0.05)',
                            borderWidth: 1,
                            titleFont: { size: 11, family: 'Pretendard' },
                            bodyFont: { size: 14, weight: 'bold', family: 'Pretendard' },
                            padding: 12,
                            boxShadow: '0 4px 6px -1px rgba(0, 0, 0, 0.1)',
                            displayColors: false,
                            callbacks: {
                                label: function(context) { return `${context.parsed.y} ${unit}`; },
                                afterLabel: function(context) {
                                    const memo = pointMemos[context.dataIndex];
                                    return memo ? `\n📝 ${memo}` : '';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            grace: '20%',
                            suggestedMin: range?.min !== null ? range.min * 0.8 : undefined,
                            suggestedMax: range?.max !== null ? range.max * 1.2 : undefined,
                            grid: { color: 'rgba(0,0,0,0.03)' },
                            border: { display: false }
                        },
                        x: {
                            offset: true,
                            grid: { display: false },
                            border: { display: false }
                        }
                    }
                }
            });
        }

        document.getElementById('imageInput').addEventListener('change', async function(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            
            const statusText = document.getElementById('ocrStatus');
            statusText.innerHTML = `⏳ 총 ${files.length}장의 사진을 스캔 준비 중입니다...`;
            statusText.className = "text-[11px] font-bold text-blue-500 mt-2 text-center";
            
            try {
                const worker = await Tesseract.createWorker('eng');
                let foundAny = false;
                const allItems = getAllItems();

                for (let i = 0; i < files.length; i++) {
                    statusText.innerHTML = `⏳ 사진 스캔 중... (${i + 1}/${files.length}장)`;
                    const ret = await worker.recognize(files[i]);
                    const upperText = ret.data.text.toUpperCase(); 
                    
                    allItems.forEach((name, index) => {
                        if (name.includes("추가항목")) return; 
                        const safeName = name.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, '\\$&').toUpperCase();
                        const match = upperText.match(new RegExp(`${safeName}\\s*[:=\\-]?\\s*(\\d+\\.?\\d*)`, 'i'));
                        if (match && match[1]) {
                            const inputEl = document.getElementById(`item_${index}`);
                            if(inputEl) {
                                inputEl.value = match[1];
                                inputEl.classList.add('bg-blue-50', 'border-blue-300');
                                setTimeout(() => inputEl.classList.remove('bg-blue-50', 'border-blue-300'), 2500);
                                foundAny = true;
                            }
                        }
                    });
                }
                
                await worker.terminate();

                if (foundAny) {
                    statusText.innerHTML = "✨ 스캔 완료! 빈칸에 들어간 수치를 확인해주세요.";
                    statusText.className = "text-[11px] font-bold text-gray-900 mt-2 text-center";
                } else {
                    statusText.innerHTML = "⚠️ 사진에서 수치를 찾지 못했습니다. 직접 기입해주세요.";
                    statusText.className = "text-[11px] font-bold text-red-500 mt-2 text-center";
                }
            } catch (err) {
                statusText.innerHTML = "❌ 스캔 중 오류가 발생했습니다. 직접 기입해주세요.";
                statusText.className = "text-[11px] font-bold text-red-500 mt-2 text-center";
            }
        });

        function exportData() {
            try {
                const dataStr = JSON.stringify({ bloodData, customItems, referenceRanges });
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const fileName = `건강수치백업_${new Date().toISOString().split('T')[0]}.json`;
                
                const a = document.createElement('a');
                a.href = url; 
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                alert("백업 파일이 다운로드 되었습니다.");
            } catch (error) {
                alert("백업 중 오류가 발생했습니다.");
            }
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const readerObj = new FileReader();
            readerObj.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (importedData.bloodData) {
                        localStorage.setItem('bloodData', JSON.stringify(importedData.bloodData));
                        localStorage.setItem('customItems', JSON.stringify(importedData.customItems || []));
                        localStorage.setItem('referenceRanges', JSON.stringify(importedData.referenceRanges || {}));
                        alert("데이터가 복원되었습니다.");
                        location.reload();
                    }
                } catch { alert("잘못된 파일 형식입니다."); }
            };
            readerObj.readAsText(file);
        }

        window.onload = () => { renderUI(); switchTab(1); };
    </script>
</body>
